<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
</head>
<body>
    <div id="main-section">
        
        <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
            <a sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')" th:href="@{/products/add}" class="btn btn-primary">Create New Product</a>
            <a sec:authorize="hasAnyAuthority('USER', 'ROLE_USER')" th:href="@{/cart}" class="btn btn-warning">View Cart</a>
        </div>
        
        <form th:action="@{/products}" method="get" class="mb-3 d-flex gap-2">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control w-25" placeholder="Search by name...">
            
            <select name="categoryId" class="form-select w-25">
                <option value="">All Categories</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${cat.id == categoryId}"></option>
            </select>
            
            <select name="sort" class="form-select w-auto">
                <option value="id" th:selected="${sort == 'id'}">Sort by ID</option>
                <option value="price" th:selected="${sort == 'price'}">Sort by Price</option>
                <option value="name" th:selected="${sort == 'name'}">Sort by Name</option>
            </select>
            
            <select name="dir" class="form-select w-auto">
                <option value="asc" th:selected="${dir == 'asc'}">Ascending</option>
                <option value="desc" th:selected="${dir == 'desc'}">Descending</option>
            </select>
            
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Image</th>
                    <th scope="col">Price</th>
                    <th scope="col">Category Name</th>
                    <th scope="col" sec:authorize="hasAnyAuthority('USER', 'ROLE_USER')">Buy</th>
                    <th scope="col" sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <th scope="row" th:text="${product.id}"></th>
                    <td th:text="${product.name}"></td>
                    <td><img height="120" width="150" th:src="${product.image}" alt="Product Image"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.category != null ? product.category.name : 'No Category'}"></td>
                    <td sec:authorize="hasAnyAuthority('USER', 'ROLE_USER')">
                        <form th:action="@{/cart/add}" method="post" class="d-inline-flex gap-1 align-items-center mb-1">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm" style="width: 60px;">
                            <button type="submit" class="btn btn-sm btn-success">Add to Cart</button>
                        </form>
                    </td>
                    <td sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-secondary">Edit</a>
                        <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- Pagination block -->
        <nav aria-label="Page navigation" th:if="${totalPages > 1}">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
              <a class="page-link" th:href="@{/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId}, sort=${sort}, dir=${dir})}">Previous</a>
            </li>
            
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
              <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, sort=${sort}, dir=${dir})}" th:text="${i}">1</a>
            </li>
            
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
              <a class="page-link" th:href="@{/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId}, sort=${sort}, dir=${dir})}">Next</a>
            </li>
          </ul>
        </nav>
        
    </div>
</body>
</html>
