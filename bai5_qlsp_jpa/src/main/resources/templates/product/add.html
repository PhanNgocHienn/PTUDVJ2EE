<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm</title>
</head>
<body>
    <div id="main-section">
        <h2 class="mt-3 mb-4">Add Product</h2>
        <form th:action="@{/products/save}" th:object="${product}" method="post" class="form border p-4 shadow-sm bg-light rounded">
            <div class="form-group mb-3">
                <label for="name" class="fw-bold">Name</label>
                <input class="form-control mt-1" type="text" th:field="*{name}" id="name" placeholder="Product Name">
            </div>
            <div class="form-group mb-3">
                <label for="image" class="fw-bold">Image URL</label>
                <input class="form-control mt-1" type="text" th:field="*{image}" id="image" placeholder="http://example.com/image.jpg">
            </div>
            <div class="form-group mb-3">
                <label for="price" class="fw-bold">Price</label>
                <input class="form-control mt-1" type="number" th:field="*{price}" id="price" placeholder="Price">
            </div>
            <div class="form-group mb-4">
                <label for="category" class="fw-bold">Category</label>
                <select th:field="*{category}" class="form-control mt-1" id="category">
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Lưu Sản Phẩm</button>
            <a th:href="@{/products}" class="btn btn-secondary ms-2">Hủy Bỏ</a>
        </form>
    </div>
</body>
</html>
