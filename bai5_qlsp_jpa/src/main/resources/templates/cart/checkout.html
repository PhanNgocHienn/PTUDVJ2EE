<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
</head>
<body>
    <div id="main-section">
        <h2 class="mb-4 mt-4">Checkout</h2>
        <div class="row">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header bg-primary text-white">Shipping Information</div>
                    <div class="card-body">
                        <form th:action="@{/checkout}" th:object="${order}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" th:field="*{customerName}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="text" class="form-control" th:field="*{phone}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Delivery Address</label>
                                <textarea class="form-control" th:field="*{address}" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Place Order</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-dark text-white">Order Summary</div>
                    <div class="card-body">
                        <ul class="list-group mb-3">
                            <li class="list-group-item d-flex justify-content-between lh-sm" th:each="item : ${cartItems}">
                                <div>
                                    <h6 class="my-0" th:text="${item.name}">Product name</h6>
                                    <small class="text-muted">Quantity: <span th:text="${item.quantity}"></span></small>
                                </div>
                                <span class="text-muted" th:text="${item.price * item.quantity}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between bg-light">
                                <div class="text-success">
                                    <h6 class="my-0">Total</h6>
                                </div>
                                <strong class="text-success" th:text="${total}"></strong>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
