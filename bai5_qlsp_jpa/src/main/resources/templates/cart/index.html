<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
</head>
<body>
    <div id="main-section">
        <h2 class="mb-4 mt-4">Your Shopping Cart</h2>
        
        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
            Your cart is empty. <a th:href="@{/products}" class="alert-link">Go shopping</a>
        </div>
        
        <div th:unless="${#lists.isEmpty(cartItems)}">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.name}"></td>
                        <td th:text="${item.price}"></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" class="d-inline-flex">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm" style="width: 80px; margin-right: 5px;">
                                <button type="submit" class="btn btn-sm btn-primary">Update</button>
                            </form>
                        </td>
                        <td th:text="${item.price * item.quantity}"></td>
                        <td>
                            <a th:href="@{/cart/remove/{id}(id=${item.productId})}" class="btn btn-sm btn-danger">Remove</a>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-secondary">
                        <th colspan="3" class="text-end">Total Amount:</th>
                        <th th:text="${total}"></th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>
            
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/cart/clear}" class="btn btn-danger">Clear Cart</a>
                <div>
                    <a th:href="@{/products}" class="btn btn-secondary me-2">Continue Shopping</a>
                    <a th:href="@{/checkout}" class="btn btn-success">Checkout</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
