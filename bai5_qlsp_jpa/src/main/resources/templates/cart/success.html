<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
</head>
<body>
    <div id="main-section" class="text-center mt-5">
        <h1 class="text-success mb-4"><i class="bi bi-check-circle-fill"></i> Order Placed Successfully!</h1>
        <p class="lead">Thank you for your purchase. Your order has been received and is being processed.</p>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Continue Shopping</a>
    </div>
</body>
</html>
