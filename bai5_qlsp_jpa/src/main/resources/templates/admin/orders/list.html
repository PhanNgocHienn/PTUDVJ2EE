<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{_layout :: dynamicTemplate(~{::#main-section})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn Hàng</title>
</head>
<body>
    <div id="main-section">
        <h2 class="mb-4 mt-4">Quản lý Đơn Hàng của User</h2>
        
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Mã Đơn</th>
                    <th>Khách Hàng</th>
                    <th>Điện Thoại</th>
                    <th>Địa Chỉ</th>
                    <th>Tổng Tiền</th>
                    <th>Ngày Đặt</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.customerName}"></td>
                    <td th:text="${order.phone}"></td>
                    <td th:text="${order.address}"></td>
                    <td th:text="${order.totalAmount}"></td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm:ss')}"></td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-info text-white">Xem Chi Tiết</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="text-center">Chưa có đơn hàng nào</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
