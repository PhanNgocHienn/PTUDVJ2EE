<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="dynamicTemplate(mainContent)">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bài 5_QLSP JPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-body">
        <div class="container-fluid mx-4">
            <a class="navbar-brand" th:href="@{/products}">Home</a>
            
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}">Sản Phẩm</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/products/add}">Thêm Sản Phẩm</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'ROLE_ADMIN')">
                        <a class="nav-link" th:href="@{/admin/orders}">Quản lý Đơn Hàng</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('USER', 'ROLE_USER')">
                        <a class="nav-link" th:href="@{/cart}">Giỏ Hàng</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item d-flex align-items-center me-3" sec:authorize="isAuthenticated()">
                        <span class="text-light">Xin chào, <span sec:authentication="name">User</span>!</span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm mt-1">Đăng Xuất</button>
                        </form>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/login}">Đăng Nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container body-content mt-4">
        <div th:replace="${mainContent}"></div>
    </div>

    <div class="card-footer text-center mt-5">
        <hr />
        <p>&copy; 2025 - Phát triển ứng dụng với J2EE</p>
    </div>
</body>

</html>
